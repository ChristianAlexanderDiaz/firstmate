<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 216">
  <!-- Before and after: how far down a review the first choice sits. -->
  <g id="pic-today">
    <title>Today: 640 words come before the first choice</title>
    <rect x="24" y="12" width="150" height="192" rx="10" fill="var(--page)" stroke="var(--line)" stroke-width="1.5"/>
    <g stroke="var(--ring)" stroke-width="4" stroke-linecap="round">
      <line x1="42" y1="34" x2="156" y2="34"/>
      <line x1="42" y1="48" x2="150" y2="48"/>
      <line x1="42" y1="62" x2="156" y2="62"/>
      <line x1="42" y1="76" x2="132" y2="76"/>
      <line x1="42" y1="90" x2="156" y2="90"/>
      <line x1="42" y1="104" x2="146" y2="104"/>
      <line x1="42" y1="118" x2="156" y2="118"/>
      <line x1="42" y1="132" x2="126" y2="132"/>
      <line x1="42" y1="146" x2="156" y2="146"/>
    </g>
    <rect x="42" y="166" width="114" height="20" rx="10" fill="var(--accent)"/>
    <text x="196" y="40" class="p-serif" font-size="21">Today</text>
    <text x="196" y="66" class="p-strong p-num" font-size="15">640 words</text>
    <text x="196" y="86" class="p-soft">before the first choice</text>
  </g>
  <g id="pic-after">
    <title>After: 120 words come before the first choice</title>
    <rect x="344" y="12" width="150" height="192" rx="10" fill="var(--page)" stroke="var(--line)" stroke-width="1.5"/>
    <g stroke="var(--ring)" stroke-width="4" stroke-linecap="round">
      <line x1="362" y1="34" x2="476" y2="34"/>
      <line x1="362" y1="48" x2="452" y2="48"/>
    </g>
    <rect x="362" y="66" width="114" height="20" rx="10" fill="var(--accent)"/>
    <text x="516" y="40" class="p-serif" font-size="21">After</text>
    <text x="516" y="66" class="p-strong p-num" font-size="15">120 words</text>
    <text x="516" y="86" class="p-soft">before the choice</text>
  </g>
  <path id="pic-choice-mark" d="M196 176 H176" fill="none" stroke="var(--ink)" stroke-width="1.5" stroke-linecap="round"/>
  <text x="202" y="181">The first choice</text>
</svg>
