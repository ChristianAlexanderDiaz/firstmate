<!doctype html>
<html lang="en" data-lavish-annotate="on">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__FM_PLAN_TITLE__</title>
<style>
/* One look for every ticket board: black and white, serif titles, soft tiles. Light by default, dark by system setting. */
*, *::before, *::after { box-sizing: border-box; }
:root { color-scheme: light dark; --page:#FFFFFF; --ink:#1A1A1A; --soft:#5F5F5F; --line:#E2E2E2; --wash:#F3F3F2; --ring:#8C8C8C; --accent:#1A1A1A; --on-accent:#FFFFFF; }
@media (prefers-color-scheme: dark) { :root { --page:#121212; --ink:#F2F2F2; --soft:#A9A9A9; --line:#2C2C2C; --wash:#1E1E1E; --ring:#808080; --accent:#F2F2F2; --on-accent:#121212; } }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--page); }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.bd { container: bd / inline-size; min-height: 100vh; min-height: 100dvh; background: var(--page); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
/* Resets sit inside :where() so every single-class rule below wins over them. */
.bd :where(h1, h2, h3, h4, p, figure, ul, ol, dl, dd, blockquote) { margin: 0; padding: 0; font-size: inherit; font-weight: inherit; }
.bd :where(ul, ol) { list-style: none; }
.bd :where(fieldset) { margin: 0; padding: 0; border: 0; min-width: 0; }
.bd :where(legend) { float: left; width: 100%; padding: 0; }
.bd :where(legend) + * { clear: both; }
.bd :where(button, textarea) { font: inherit; color: inherit; }
.bd :where(button) { cursor: pointer; }
.bd-opt:has(input:focus-visible), .bd button:focus-visible, .bd-more summary:focus-visible, .bd-write-box:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.bd-title, .bd-h, .bd h3, .bd legend, .bd figcaption, .bd-facts strong, .bd-words p, .bd-steps > li::before { font-family: ui-serif, "New York", "Iowan Old Style", "Palatino Linotype", Georgia, serif; }
.bd-page { margin: 0 auto; max-width: 720px; padding: 30px 18px 0; }
.bd-part { min-width: 0; margin-top: 46px; }
.bd-ask { margin-top: 0; }
.bd-lead, .bd-plan-main, .bd-call, .bd-picks, .bd-q { min-width: 0; }

/* 1 to 3: title, TL;DR and the one risk line, his words, the picture */
.bd-title { font-size: 29px; line-height: 1.12; font-weight: 600; letter-spacing: -0.01em; text-wrap: balance; }
.bd-id { color: var(--soft); }
.bd-gist { margin-top: 14px; font-size: 17px; line-height: 1.5; text-wrap: pretty; }
.bd-warn { display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px 16px; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 15.5px; line-height: 1.45; }
.bd-warn b { font-weight: 650; }
.bd-warn span { text-wrap: pretty; }
.bd-warn-more { justify-self: start; padding: 8px 0; border: 0; background: none; font-size: 14.5px; line-height: 1.45; color: var(--soft); text-decoration: underline; text-decoration-color: var(--ring); text-underline-offset: 4px; white-space: nowrap; }
.bd-words { margin-top: 26px; padding-left: 18px; border-left: 2px solid var(--ink); }
.bd-words p { font-size: 18.5px; line-height: 1.42; text-wrap: pretty; }
.bd-words footer { margin-top: 8px; font-size: 14px; line-height: 1.4; color: var(--soft); }
.bd-pic { container: pic / inline-size; margin-top: 28px; padding: 20px 18px; border-radius: 18px; background: var(--wash); }
.bd figcaption { margin-bottom: 20px; font-size: 19px; line-height: 1.25; font-weight: 600; }
/* One frame, the same size on every board. The picture inside is drawn by hand for that ticket, 640 by 216, and
   takes every colour from the page, so it follows light and dark. */
.bd-frame { height: 216px; display: flex; flex-direction: column; justify-content: center; min-width: 0; overflow: hidden; }
.bd-art { display: block; flex: none; width: 100%; height: 100%; color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; }
.bd-art text { fill: var(--ink); }
.bd-art .p-soft { fill: var(--soft); }
.bd-art .p-strong { font-weight: 650; }
.bd-art .p-num { font-variant-numeric: tabular-nums; }
.bd-art .p-serif { font-family: ui-serif, "New York", "Iowan Old Style", "Palatino Linotype", Georgia, serif; font-weight: 600; }
.bd-pan { display: none; margin-top: 10px; font-size: 13px; line-height: 1.4; color: var(--soft); }
/* A frame too narrow to keep the labels readable shows the picture at full size and slides sideways. */
@container pic (max-width: 520px) {
  .bd-frame { display: block; overflow-x: auto; overflow-y: hidden; overscroll-behavior-x: contain; }
  .bd-art { width: 640px; height: 216px; }
  .bd-pan { display: block; }
}
.bd-facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line); }
.bd-facts strong, .bd-facts span { display: block; }
.bd-facts strong { font-size: 24px; line-height: 1.2; font-weight: 600; font-variant-numeric: tabular-nums; }
.bd-facts span { margin-top: 2px; font-size: 14px; line-height: 1.4; color: var(--soft); }

/* 4: what the worker will do. The step being read gets a band; an answered step gets a tick. */
.bd-h { font-size: 24px; line-height: 1.2; font-weight: 600; letter-spacing: -0.005em; }
.bd-h-n { margin-left: 12px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14.5px; font-weight: 400; letter-spacing: 0; color: var(--soft); }
.bd-note { margin-top: 8px; max-width: 64ch; font-size: 14.5px; line-height: 1.45; color: var(--soft); }
.bd-steps { margin-top: 18px; counter-reset: step; border-bottom: 1px solid var(--line); }
.bd-steps > li { position: relative; counter-increment: step; display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; column-gap: 10px; row-gap: 2px; align-items: baseline; padding: 14px 0 8px; border-top: 1px solid var(--line); scroll-margin-top: calc(var(--top, 0px) + 24px); transition: background-color 160ms ease-out, box-shadow 160ms ease-out; }
.bd-steps > li::before { content: counter(step); font-size: 19px; line-height: 1.3; color: var(--soft); font-variant-numeric: tabular-nums; }
.bd-steps > li.is-active { background: var(--wash); box-shadow: -14px 0 0 var(--wash), 14px 0 0 var(--wash); }
.bd-steps > li.is-active::after { content: ""; position: absolute; left: -14px; top: -1px; bottom: 0; width: 3px; background: var(--ink); }
.bd-steps > li.is-flash { animation: bd-flash 1500ms ease-out; }
@keyframes bd-flash { 0%, 28% { background-color: var(--accent); box-shadow: -14px 0 0 var(--accent), 14px 0 0 var(--accent); color: var(--on-accent); } }
/* The story line: a lead word the board adds by position, then one plain sentence. */
.bd-step-say { grid-column: 2 / -1; grid-row: 1; font-size: 16.5px; line-height: 1.45; text-wrap: pretty; }
.bd-step-lead { font-weight: 650; }
/* The technical wording, closed until asked for. */
.bd-step-more { grid-column: 2; grid-row: 2; justify-self: start; align-self: center; display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 10px 0 0; border: 0; background: none; font-size: 13.5px; line-height: 1.4; color: var(--soft); }
.bd-step-more svg { width: 10px; height: 10px; flex: none; transition: transform 120ms ease-out; }
.bd-step-more[aria-expanded="true"] svg { transform: rotate(90deg); }
.bd-step-detail { grid-column: 2 / -1; grid-row: 3; padding: 2px 0 8px; font-size: 14.5px; line-height: 1.45; color: var(--soft); text-wrap: pretty; }
.bd-steps > li.is-flash .bd-step-more, .bd-steps > li.is-flash .bd-step-detail { color: inherit; }
/* The close of the story: what he will see. Bleeds like the active band so its mark sits under the step numbers. */
.bd-end { display: grid; grid-template-columns: 26px minmax(0, 1fr); column-gap: 10px; align-items: start; margin: 14px -14px 0; padding: 16px 14px; border-radius: 16px; background: var(--wash); font-size: 16.5px; line-height: 1.45; text-wrap: pretty; }
.bd-end svg { width: 20px; height: 20px; margin-top: 2px; }
.bd-end b { font-weight: 650; }
.bd-step-q, .bd-q-step, .bd-q-plan { display: inline-flex; align-items: center; gap: 6px; min-height: 30px; padding: 3px 12px; border: 1px solid var(--ring); border-radius: 999px; background: transparent; font-size: 13px; line-height: 1.4; white-space: nowrap; transition: background-color 120ms ease-out, color 120ms ease-out, border-color 120ms ease-out; }
.bd-step-q { grid-column: 3; grid-row: 2; align-self: center; }
.bd-tick { display: none; width: 12px; height: 12px; flex: none; }
.bd-steps > li.is-picked .bd-step-q { border-color: var(--ink); }
.bd-steps > li.is-picked .bd-tick { display: block; }
.bd-steps > li.is-active .bd-step-q { border-color: var(--accent); background: var(--accent); color: var(--on-accent); }
.bd-scope { display: grid; gap: 24px; margin-top: 26px; }
.bd h3 { font-size: 18px; line-height: 1.3; font-weight: 600; }
.bd-list ul { display: grid; gap: 8px; margin-top: 10px; }
.bd-list li { position: relative; padding-left: 20px; font-size: 15px; line-height: 1.45; text-wrap: pretty; }
.bd-list li::before { content: ""; position: absolute; left: 2px; top: 0.56em; width: 6px; height: 6px; border-radius: 50%; background: var(--ink); }
.bd-wont li::before { left: 0; top: 0.68em; width: 10px; height: 2px; border-radius: 1px; background: var(--ring); }
.bd-done li { padding-left: 26px; }
.bd-done li::before { left: 0; top: 0.2em; width: 15px; height: 15px; border: 1.5px solid var(--ring); border-radius: 4px; background: transparent; }

/* 5 to 7: risk and undo, done-when and proof, already decided */
.bd-safe { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; scroll-margin-top: calc(var(--top, 0px) + 8px); }
.bd-tile { min-width: 0; padding: 20px 20px 22px; border-radius: 18px; background: var(--wash); }
.bd-proof { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 14.5px; line-height: 1.45; color: var(--soft); }
.bd-proof b { display: block; color: var(--ink); font-weight: 650; }
.bd-extra { margin-top: 22px; }
.bd-defaults { min-width: 0; scroll-margin-top: calc(var(--top, 0px) + 24px); }
.bd-defaults dl { display: grid; margin-top: 10px; border-bottom: 1px solid var(--line); }
.bd-defaults dl > div { display: grid; grid-template-columns: 104px minmax(0, 1fr); column-gap: 14px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 15px; line-height: 1.45; }
.bd-defaults dt { font-weight: 650; }
.bd-defaults dd { color: var(--soft); }
.bd-defaults + .bd-more { margin-top: 14px; }
.bd-more { border-radius: 14px; background: var(--wash); }
.bd-more summary { padding: 14px 18px; font-size: 14.5px; color: var(--soft); cursor: pointer; }
.bd-more-body { padding: 0 18px 18px; font-size: 14px; line-height: 1.5; color: var(--soft); white-space: pre-wrap; overflow-wrap: anywhere; }

/* 8: the questions. Each is a quiet card; the one that matches the step being read gets the outline. */
.bd-picks { display: grid; gap: 6px; margin-top: 12px; }
.bd-q { position: relative; margin: 0 -16px; padding: 14px; border: 2px solid transparent; border-radius: 22px; scroll-margin-top: calc(var(--top, 0px) + 24px); transition: border-color 160ms ease-out; }
.bd-q.is-active { border-color: var(--ink); }
.bd legend { padding: 0 84px 12px 0; font-size: 20px; line-height: 1.25; font-weight: 600; }
.bd-n { margin-right: 10px; color: var(--soft); font-weight: 400; }
.bd-q-step, .bd-q-plan { position: absolute; top: 12px; right: 14px; }
/* Question 1 on a board whose plans differ in shape: one card per direction. Stacked on a phone; side by side
   with the rows lined up (mark, name, story, risk, cost) from 620 px, so the differences read across. */
.bd-ways { --ways: 2; }
.bd-opt.bd-way { display: grid; grid-template-columns: minmax(0, 1fr); row-gap: 8px; align-content: start; padding: 0 14px 14px; }
.bd-way-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 44px; margin: 0 -14px; padding: 0 14px 0 0; }
.bd-way-top .bd-pick { align-self: stretch; align-items: center; width: 46px; padding-top: 0; }
.bd-way-name { font-size: 16px; line-height: 1.3; font-weight: 650; text-wrap: balance; }
.bd-way-story { font-size: 14.5px; line-height: 1.45; text-wrap: pretty; }
.bd-way-row { display: block; padding-top: 8px; border-top: 1px solid color-mix(in srgb, currentColor 16%, transparent); font-size: 14px; line-height: 1.42; text-wrap: pretty; }
.bd-way-row b { display: block; font-size: 12.5px; line-height: 1.4; font-weight: 650; opacity: 0.72; }
.bd-way-why { margin-top: 10px; padding: 0 2px; font-size: 14px; line-height: 1.45; color: var(--soft); text-wrap: pretty; }
.bd-way-why b { margin-right: 8px; color: var(--ink); font-weight: 650; }
.bd-plan { scroll-margin-top: calc(var(--top, 0px) + 8px); }
.bd-note b { color: var(--ink); font-weight: 650; }
.bd-plan.is-swapped .bd-plan-main { animation: bd-swap 320ms ease-out; }
@keyframes bd-swap { from { opacity: 0; transform: translateY(6px); } }
.bd-opts { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
/* An option tile is words plus a small pick control. Only the control is a native input, so a click on the
   words leaves a Lavish note instead of picking. */
.bd-opt { position: relative; display: grid; grid-template-columns: 46px minmax(0, 1fr); border-radius: 14px; background: var(--wash); transition: background-color 120ms ease-out, color 120ms ease-out; }
.bd-pick { display: flex; justify-content: center; padding-top: 14px; cursor: pointer; }
.bd-pick input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.bd-dot { width: 20px; height: 20px; flex: none; border: 1.5px solid var(--ring); border-radius: 50%; }
.bd-pick input:checked + .bd-dot { border-color: currentColor; background: radial-gradient(circle, currentColor 0 4.5px, transparent 5.5px); }
.bd-opt:has(input:checked) { background: var(--accent); color: var(--on-accent); }
.bd-opt-body { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 12px; row-gap: 4px; align-content: start; align-items: start; min-width: 0; padding: 14px 16px 14px 0; }
.bd-opt-label { grid-column: 1; grid-row: 1; min-width: 0; font-size: 16px; line-height: 1.35; font-weight: 650; }
.bd-rec { grid-column: 2; grid-row: 1; padding: 2px 9px; border: 1px solid currentColor; border-radius: 999px; font-size: 12px; line-height: 1.4; font-weight: 600; white-space: nowrap; }
.bd-opt-detail { grid-column: 1 / -1; grid-row: 2; min-width: 0; font-size: 14.5px; line-height: 1.45; color: var(--soft); }
.bd-opt:has(input:checked) .bd-opt-detail { color: inherit; opacity: 0.82; }
.bd-write { display: block; min-height: 44px; margin-top: 2px; padding: 10px 16px; border: 0; background: none; text-align: left; font-size: 14.5px; color: var(--soft); text-decoration: underline; text-decoration-color: var(--ring); text-underline-offset: 4px; }
.bd-q > .bd-write { margin-bottom: -10px; }
.bd-defaults .bd-write { padding-left: 0; }
.bd-write-box { display: block; width: 100%; margin-top: 2px; padding: 12px 16px; border: 1px solid var(--ring); border-radius: 14px; background: var(--page); font-size: 16px; resize: vertical; }
.bd-q > .bd-write-box { margin-top: 12px; }
.bd-none { margin-top: 22px; }
.bd-none-t { font-family: ui-serif, "New York", "Iowan Old Style", "Palatino Linotype", Georgia, serif; font-size: 26px; line-height: 1.2; font-weight: 600; text-wrap: balance; }
.bd-none-d { margin-top: 10px; font-size: 15.5px; line-height: 1.45; color: var(--soft); }
.bd-none-more { min-height: 44px; margin-top: 4px; padding: 0; border: 0; background: none; font-size: 14.5px; text-decoration: underline; text-decoration-color: var(--ring); text-underline-offset: 4px; }
.bd-count { margin-right: auto; font-size: 14.5px; color: var(--soft); font-variant-numeric: tabular-nums; }
.bd-all, .bd-jump { min-height: 44px; padding: 0; border: 0; background: none; font-size: 14.5px; text-decoration: underline; text-decoration-color: var(--ring); text-underline-offset: 4px; white-space: nowrap; }
.bd-send-btn { min-height: 48px; padding: 0 28px; border: 0; border-radius: 14px; background: var(--accent); color: var(--on-accent); font-size: 16px; font-weight: 650; white-space: nowrap; }

/* ---- The research brief: the answer, his question, one picture, then what we found, expect, could not check
   and will watch. Every claim is its own row. The mark says how sure: a dot was seen, a dashed ring is a guess,
   an open ring was not checked. ---- */
.rb-lead { min-width: 0; }
.rb-top .bd-title { font-size: 21px; line-height: 1.25; letter-spacing: 0; }
.rb-answer { margin-top: 14px; font-family: ui-serif, "New York", "Iowan Old Style", "Palatino Linotype", Georgia, serif; font-size: 25px; line-height: 1.22; font-weight: 600; letter-spacing: -0.01em; text-wrap: balance; }
.rb-tag { display: inline-block; margin-left: 12px; padding: 2px 10px; border: 1px dashed var(--ring); border-radius: 999px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 12.5px; line-height: 1.4; font-weight: 600; letter-spacing: 0; vertical-align: middle; white-space: nowrap; }
.rb-topic { margin-top: 26px; }
.rb-rows { margin-top: 12px; border-bottom: 1px solid var(--line); }
.rb-row { position: relative; display: grid; grid-template-columns: 26px minmax(0, 1fr); column-gap: 10px; row-gap: 6px; padding: 14px 0; border-top: 1px solid var(--line); scroll-margin-top: 24px; }
.rb-row::before { content: ""; grid-column: 1; grid-row: 1; justify-self: start; width: 11px; height: 11px; margin: 0.42em 0 0 1px; border: 1.5px solid var(--ink); border-radius: 50%; background: var(--ink); }
.rb-guess::before { border-style: dashed; border-color: var(--ink); background: transparent; }
.rb-gap::before { border-color: var(--ring); background: transparent; }
.rb-main, .rb-side { grid-column: 2; min-width: 0; }
.rb-claim { font-size: 16.5px; line-height: 1.45; text-wrap: pretty; }
.rb-detail { margin-top: 4px; font-size: 14.5px; line-height: 1.45; color: var(--soft); text-wrap: pretty; }
.rb-side { font-size: 14px; line-height: 1.45; color: var(--soft); overflow-wrap: anywhere; }
.rb-side b { margin-right: 8px; color: var(--ink); font-size: 12.5px; font-weight: 650; }
.rb-side a { color: inherit; text-decoration: underline; text-decoration-color: var(--ring); text-underline-offset: 3px; }
.rb-side a:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.rb-sure { margin-top: 12px; padding: 16px 18px; border-radius: 16px; background: var(--wash); font-size: 16px; line-height: 1.45; text-wrap: pretty; }
.rb-sure b { display: block; font-size: 12.5px; font-weight: 650; }
.rb-date::before { display: none; }
.rb-date { grid-template-columns: minmax(0, 1fr); }
.rb-date .rb-when, .rb-date .rb-main { grid-column: 1; }
.rb-when { font-size: 15px; line-height: 1.45; font-weight: 650; font-variant-numeric: tabular-nums; }
.bd[data-board="research"] .bd-page { padding-bottom: 56px; }

/* ---- Under 980 px (a phone): the Scroll order. One column, questions last, send bar on the bottom edge. ---- */
.bd-answer { display: contents; }
.bd-call { margin-top: 46px; scroll-margin-top: calc(var(--top, 0px) + 24px); }
.bd-send { position: sticky; bottom: 0; z-index: 2; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; margin: 30px -18px 0; padding: 10px 18px; border-top: 1px solid var(--line); background: var(--page); }
.bd.is-answering .bd-jump { display: none; }
@container bd (max-width: 520px) {
  .bd-opt-body { grid-template-columns: minmax(0, 1fr); }
  .bd-rec { grid-column: 1; grid-row: 1; justify-self: start; }
  .bd-opt-label { grid-row: 2; }
  .bd-opt-detail { grid-row: 3; }
  .bd-send { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 0 12px; padding: 8px 18px; }
  .bd-count { grid-column: 1; grid-row: 1; align-self: end; }
  .bd-jump, .bd-all { grid-column: 1; grid-row: 2; justify-self: start; align-self: start; min-height: 34px; }
  .bd:not(.is-answering) .bd-all { display: none; }
  .bd-send-btn { grid-column: 2; grid-row: 1 / span 2; padding: 0 22px; }
}

@container bd (min-width: 620px) {
  .bd-ways { grid-template-columns: repeat(var(--ways), minmax(0, 1fr)); grid-template-rows: repeat(5, auto); row-gap: 0; }
  .bd-opt.bd-way { grid-row: span 5; grid-template-rows: subgrid; row-gap: 8px; }
}

/* ---- 980 px and wider (a laptop): Split. The brief scrolls on the left; the questions and the send stay put on the right. ---- */
@container bd (min-width: 980px) {
  .bd-page { display: grid; grid-template-columns: minmax(0, 1fr) minmax(430px, 41%); align-items: start; max-width: none; padding: 0; }
  /* Three cards side by side need more room than a list of options, so a Ways board gives the pane half. */
  .bd:has(.bd-q-way) .bd-page { grid-template-columns: minmax(0, 1fr) minmax(520px, 50%); }
  .bd:has(.bd-q-way) .bd-call { padding-left: 30px; padding-right: 30px; }
  .bd-part { grid-column: 1; margin-top: 0; padding: 56px 56px 0 48px; }
  .bd-ask { padding-top: 44px; }
  .bd-title { font-size: 38px; line-height: 1.08; }
  .bd-gist { margin-top: 16px; font-size: 18px; }
  .bd-warn { grid-template-columns: auto minmax(0, 1fr) auto; align-items: baseline; margin-top: 20px; }
  .bd-warn-more { padding: 0; }
  .bd-words { margin-top: 30px; padding-left: 22px; }
  .bd-pic { padding: 24px; border-radius: 20px; }
  .bd-h { font-size: 27px; }
  .bd-steps > li { grid-template-columns: 30px minmax(0, 1fr) auto; column-gap: 12px; padding-bottom: 6px; }
  .bd-step-say { grid-column: 2; font-size: 17px; }
  .bd-step-q { grid-column: 3; grid-row: 1; align-self: baseline; }
  .bd-step-more { min-height: 30px; }
  .bd-end { grid-template-columns: 30px minmax(0, 1fr); column-gap: 12px; font-size: 17px; }
  .bd-scope { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px; margin-top: 28px; }
  .bd-safe { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  .bd-done { grid-column: 1 / -1; }
  .bd-extra { padding-top: 22px; padding-bottom: 56px; }
  .bd-done ul { grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 28px; }
  .bd-answer { grid-column: 2; grid-row: 1 / span 4; position: sticky; top: var(--top, 0px); display: flex; flex-direction: column; height: calc(100vh - var(--top, 0px)); height: calc(100dvh - var(--top, 0px)); padding: 0; background: var(--wash); }
  .bd-call { flex: 1 1 auto; min-height: 0; margin-top: 0; overflow-y: auto; overscroll-behavior: contain; padding: 40px 34px 28px; }
  .bd-opt, .bd-write-box { background: var(--page); }
  .bd-opt:has(input:checked) { background: var(--accent); }
  .bd-send { position: static; flex: none; margin: 0; padding: 12px 34px; background: transparent; }
  .bd-jump { display: none; }
}
/* A research brief that asks for a pick borrows the split above. One with nothing to pick has no right pane:
   a single column from 980 px, and from 1160 px the answer sits beside its picture and each source beside its fact. */
@container bd (min-width: 980px) {
  .bd[data-board="research-pick"] .bd-answer { grid-row: 1 / span 6; }
  .bd[data-board="research"] .bd-page { display: block; max-width: 808px; padding: 44px 48px 72px; }
  .bd[data-board="research"] .bd-part { margin-top: 54px; padding: 0; }
  .bd[data-board="research"] .rb-top { margin-top: 0; }
  .bd[data-board="research"] .bd-extra { margin-top: 28px; }
  .rb-top .bd-title { font-size: 23px; }
  .rb-answer { margin-top: 16px; font-size: 30px; line-height: 1.2; }
  .rb-claim { font-size: 17px; }
  .rb-date { grid-template-columns: 190px minmax(0, 1fr); column-gap: 24px; }
  .rb-date .rb-when { grid-row: 1; }
  .rb-date .rb-main { grid-column: 2; grid-row: 1; }
}
@container bd (min-width: 1160px) {
  .bd[data-board="research"] .bd-page { max-width: 1240px; }
  .bd[data-board="research"] .rb-top { display: grid; grid-template-columns: minmax(0, 1fr) 688px; column-gap: 56px; align-items: start; }
  .bd[data-board="research"] .rb-top .bd-head { grid-column: 1 / -1; }
  .bd[data-board="research"] .rb-top .bd-pic { grid-column: 2; margin-top: 16px; }
  .bd[data-board="research"] .rb-lead { grid-column: 1; }
  .bd[data-board="research"] .rb-top:not(:has(.bd-pic)) .rb-lead { grid-column: 1 / -1; max-width: 760px; }
  .bd[data-board="research"] .rb-row { grid-template-columns: 26px minmax(0, 64ch) minmax(0, 1fr); }
  .bd[data-board="research"] .rb-side { grid-column: 3; grid-row: 1; padding-left: 36px; }
  .bd[data-board="research"] .rb-side b { display: block; margin-right: 0; }
  .bd[data-board="research"] .rb-date { grid-template-columns: 216px minmax(0, 64ch); column-gap: 10px; }
  .bd[data-board="research"] .rb-sure, .bd[data-board="research"] .bd-note { max-width: calc(36px + 64ch); }
}
@media (prefers-reduced-motion: reduce) { .bd *, .bd *::before, .bd *::after { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<main class="bd" data-board="__FM_PLAN_KIND__"><div class="bd-page">
__FM_PLAN_BOARD__
</div></main>
<script>
// Answers leave the board through this one function, in the answer shape the keyed-answer reader
// already understands. It checks every answer before it queues any; a local preview never sends.
window.fmPlanBoard = {
  send: function (lavish, answers) {
    if (!answers.length) return { sent: 0, message: "Pick an answer or add your words first." };
    var items = [];
    for (var i = 0; i < answers.length; i += 1) {
      var one = answers[i];
      var text = [one.selection, one.note].filter(Boolean).join(" - ");
      if (!one.selection && one.note === "reconcile") return { sent: 0, message: "Please use different words for your answer." };
      if (new TextEncoder().encode(text).length > 512) return { sent: 0, message: "An answer is too long to send (512 bytes maximum): " + one.title.slice(0, 60) };
      items.push({ one: one, text: text });
    }
    if (!lavish || !lavish.queuePrompt) return { sent: 0, message: "Preview only. Share your picks in the conversation." };
    items.forEach(function (item) {
      lavish.queuePrompt(item.one.title + ": " + item.text, { tag: "choice", text: item.text, element: item.one.element, queueKey: item.one.question,
        data: { schema: "fm-bearings-answer.v1", question: item.one.question, selection: item.one.selection, note: item.one.note } });
    });
    if (lavish.sendQueuedPrompts) { lavish.sendQueuedPrompts(); return { sent: items.length, message: "Sent." }; }
    return { sent: items.length, message: "Queued for sending." };
  }
};
</script>
<script>
(function () {
  "use strict";
  var board = document.querySelector(".bd");
  var count = board.querySelector(".bd-count");
  var pane = board.querySelector(".bd-answer");
  var calm = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function glide() { return calm ? "auto" : "smooth"; }

  /* True when the questions sit in their own pane on the right (a laptop). False in the one-column order. */
  function split() { return !!pane && window.getComputedStyle(pane).position === "sticky"; }
  function stepOf(q) { return board.querySelector('.bd-steps li[data-q="' + q + '"]'); }
  function questionOf(q) { return board.querySelector('.bd-q[data-i="' + q + '"]'); }

  /* One step and its question are "active" at a time: the pair being read, clicked or answered. */
  function activate(q) {
    board.querySelectorAll(".bd-steps li[data-q]").forEach(function (step) { step.classList.toggle("is-active", Number(step.dataset.q) === q); });
    board.querySelectorAll(".bd-q").forEach(function (node) { node.classList.toggle("is-active", Number(node.dataset.i) === q); });
  }
  /* While the page is moving because of a click, reading-follow keeps its hands off. */
  var followHold = 0;
  var followLine;
  function hold() { followHold = Date.now() + 900; }
  /* Bring a question to the top of the right pane. Only the pane moves, never the reading column. */
  function showQuestion(q) {
    var node = questionOf(q);
    if (!split()) { hold(); node.scrollIntoView({ block: "center", behavior: glide() }); return; }
    var pane = board.querySelector(".bd-call");
    var top = pane.scrollTop + node.getBoundingClientRect().top - pane.getBoundingClientRect().top - 18;
    pane.scrollTo({ top: Math.max(0, top), behavior: glide() });
  }
  function showStep(q) {
    var box = stepOf(q).getBoundingClientRect();
    if (box.top >= 12 && box.bottom <= window.innerHeight - 80) return;
    hold();
    stepOf(q).scrollIntoView({ block: "center", behavior: glide() });
  }
  function flash(step) {
    step.classList.remove("is-flash");
    void step.offsetWidth;
    step.classList.add("is-flash");
    window.clearTimeout(step.flashTimer);
    step.flashTimer = window.setTimeout(function () { step.classList.remove("is-flash"); }, 1600);
  }

  /* Reading-follow. The reading line starts a quarter of the way down the window and drifts to 70% by the
     end of the page, so every step crosses it. When a step with a question crosses the line, that question
     comes to the top of the right pane. */
  function follow() {
    if (!split()) return;
    var box = board.getBoundingClientRect();
    var tall = window.innerHeight;
    var travel = box.height - tall;
    var done = travel > 0 ? Math.min(1, Math.max(0, -box.top / travel)) : 0;
    var line = tall * (0.25 + 0.45 * done);
    var hit = null;
    board.querySelectorAll(".bd-steps li[data-q]").forEach(function (step) {
      var row = step.getBoundingClientRect();
      if (row.top <= line && line < row.bottom) hit = Number(step.dataset.q);
    });
    if (hit === followLine) return;
    followLine = hit;
    if (hit === null || Date.now() < followHold) return;
    activate(hit);
    showQuestion(hit);
  }
  /* Pointing follows too: rest the pointer on a step and its question comes up. Only a pointer that really
     moved counts, so a page scrolling under a still pointer changes nothing. */
  var lastPoint = "";
  var pointTimer = 0;
  board.addEventListener("mousemove", function (event) {
    var point = event.clientX + "," + event.clientY;
    if (point === lastPoint) return;
    lastPoint = point;
    var step = event.target.closest(".bd-steps li[data-q]");
    window.clearTimeout(pointTimer);
    if (!step || !split() || step.classList.contains("is-active")) return;
    pointTimer = window.setTimeout(function () {
      activate(Number(step.dataset.q));
      showQuestion(Number(step.dataset.q));
    }, 140);
  });
  var queued = false;
  function onScroll() {
    if (queued) return;
    queued = true;
    window.requestAnimationFrame(function () { queued = false; follow(); });
  }
  window.addEventListener("scroll", onScroll, { passive: true });
  window.addEventListener("resize", onScroll);

  /* A board with several plans holds one per direction. Show the one that was picked; hide the rest. */
  function setWay(id) {
    board.querySelectorAll("[data-way]").forEach(function (node) { node.hidden = node.dataset.way !== id; });
    var plan = board.querySelector(".bd-plan:not([hidden])");
    plan.classList.remove("is-swapped");
    void plan.offsetWidth;
    plan.classList.add("is-swapped");
    followLine = undefined;
  }
  /* Keep the story in step with the picks: the plain sentence and the wording behind Details change together. */
  function refresh() {
    var way = board.querySelector(".bd-q-way input:checked");
    if (way && board.querySelector(".bd-plan:not([hidden])").dataset.way !== way.value) setWay(way.value);
    var questions = board.querySelectorAll(".bd-q:not([hidden])");
    var done = 0;
    questions.forEach(function (q) {
      var box = q.querySelector(".bd-write-box");
      var checked = q.querySelector("input:checked");
      var words = !box.hidden && box.value.trim();
      if (checked || words) done += 1;
      var step = stepOf(Number(q.dataset.i));
      if (!step) return;
      var text = words ? "the worker does what you wrote for question " + q.querySelector(".bd-n").textContent + "."
        : checked ? checked.dataset.say : step.dataset.say;
      var detail = words ? "Your own words replace the options for this step." : checked ? checked.dataset.does : step.dataset.does;
      var line = step.querySelector(".bd-step-text");
      if (line.textContent !== text) { line.textContent = text; flash(step); }
      step.querySelector(".bd-step-detail").textContent = detail;
      step.classList.toggle("is-picked", !!(checked || words));
    });
    if (!questions.length) return;
    count.textContent = done + " of " + questions.length + " picked";
    board.querySelector(".bd-h-n").textContent = questions.length + (questions.length === 1 ? " question" : " questions");
  }
  function answered(event) {
    refresh();
    var q = event.target.closest(".bd-q");
    if (!q) return;
    var i = Number(q.dataset.i);
    activate(i);
    var step = stepOf(i);
    if (event.type === "change" && step) flash(step);
  }
  board.addEventListener("change", answered);
  board.addEventListener("input", answered);

  /* Every answer on the board, ready to send: the picks, the written answers, and a change to a default. */
  function answers() {
    var list = [];
    board.querySelectorAll(".bd-q:not([hidden])").forEach(function (q) {
      var checked = q.querySelector("input:checked");
      var box = q.querySelector(".bd-write-box");
      var note = box.hidden ? "" : box.value.trim();
      if (!checked && !note) return;
      list.push({ question: q.dataset.lavishQuestion, title: q.querySelector(".bd-qt").textContent.trim(),
        selection: checked ? checked.value : "", note: note, element: q });
    });
    var none = board.querySelector(".bd-none");
    if (none) list.push({ question: "go", title: "Nothing to decide", selection: "go", note: "", element: none });
    var change = board.querySelector(".bd-defaults .bd-write-box");
    if (change && !change.hidden && change.value.trim()) {
      list.push({ question: "defaults", title: "Already decided, change one", selection: "", note: change.value.trim(), element: change.closest(".bd-defaults") });
    }
    return list;
  }
  board.addEventListener("click", function (event) {
    var button = event.target.closest("button");
    if (!button) return;
    var kind = button.classList;
    if (kind.contains("bd-write")) {
      var box = button.closest(".bd-q, .bd-defaults").querySelector(".bd-write-box");
      box.hidden = !box.hidden;
      button.setAttribute("aria-expanded", String(!box.hidden));
      if (!box.hidden) box.focus();
      refresh();
    } else if (kind.contains("bd-step-more")) {
      var more = button.closest("li").querySelector(".bd-step-detail");
      more.hidden = !more.hidden;
      button.setAttribute("aria-expanded", String(!more.hidden));
    } else if (kind.contains("bd-step-q")) {
      activate(Number(button.dataset.q));
      showQuestion(Number(button.dataset.q));
    } else if (kind.contains("bd-q-step")) {
      activate(Number(button.dataset.q));
      showStep(Number(button.dataset.q));
      flash(stepOf(Number(button.dataset.q)));
    } else if (kind.contains("bd-q-plan")) {
      hold();
      board.querySelector(".bd-plan:not([hidden])").scrollIntoView({ block: "start", behavior: glide() });
    } else if (kind.contains("bd-warn-more")) {
      hold();
      board.querySelector(".bd-safe:not([hidden])").scrollIntoView({ block: "start", behavior: glide() });
    } else if (kind.contains("bd-none-more")) {
      hold();
      board.querySelector(".bd-extra").scrollIntoView({ block: "start", behavior: glide() });
    } else if (kind.contains("bd-jump")) {
      board.querySelector(".bd-call").scrollIntoView({ block: "start", behavior: glide() });
    } else if (kind.contains("bd-all")) {
      /* A direction he already picked stays; an unpicked one takes the recommended, if there is one. */
      var ways = board.querySelector(".bd-q-way");
      if (ways && !ways.querySelector("input:checked") && ways.querySelector("input[data-rec]")) {
        ways.querySelector("input[data-rec]").checked = true;
        refresh();
      }
      board.querySelectorAll(".bd-q:not([hidden]):not(.bd-q-way) input[data-rec]").forEach(function (input) { input.checked = true; });
      refresh();
    } else if (kind.contains("bd-send-btn")) {
      count.textContent = window.fmPlanBoard.send(window.lavish, answers()).message;
    }
  });
  /* One-column order: hide "See the questions" once they are on screen. */
  var picks = board.querySelector(".bd-picks");
  if (window.IntersectionObserver && picks) {
    new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) { board.classList.toggle("is-answering", entry.isIntersecting); });
    }, { rootMargin: "0px 0px -120px 0px" }).observe(picks);
  }
  /* Picks the board was built with, or that the browser kept across a reload, count from the start. */
  refresh();
  follow();
})();
</script>
</body>
</html>
